version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: flight-scanner-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - flight-scanner-network

  redis:
    image: redis:7-alpine
    container_name: flight-scanner-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - flight-scanner-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flight-scanner-backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/flight-scanner?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/src:/app/src
    networks:
      - flight-scanner-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flight-scanner-frontend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - flight-scanner-network

volumes:
  mongodb_data:
  redis_data:

networks:
  flight-scanner-network:
    driver: bridge
